<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Submission History - GrowCode</title>

    <link rel="stylesheet" href="/css/style.css">
</head>

<body>

    <header class="navbar">
        <div class="logo">GrowCode</div>
        <nav>
            <a href="/">Problems</a>
            <a href="/history.html">History</a>
            <a href="/leaderboard.html">Leaderboard</a>
            <a href="/login.html" id="auth-link">Login</a>
        </nav>
    </header>

    <div class="container">

        <div class="page-header">
            <h1>Submission History</h1>
            <p>View your previous code submissions and their verdicts.</p>
        </div>

        <div id="history-message">
            Loading submissions...
        </div>

        <div id="submission-history"></div>

    </div>


    <div id="code-modal" class="code-modal" hidden>
        <section class="code-modal-content" role="dialog"
                aria-modal="true" aria-labelledby="code-modal-title">
            <div class="code-modal-header">
                <h2 id="code-modal-title">Submitted Source Code</h2>
                <button type="button" id="close-code-modal">Close</button>
            </div>

            <p id="code-message" role="status"></p>

            <pre><code id="submission-code"></code></pre>

            <button type="button" id="copy-submission-code">
                Copy Code
            </button>
        </section>
    </div>


    <script src="/js/history.js"></script>

</body>
</html>
