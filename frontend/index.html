<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrowCode</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    
    <header class="navbar">
        <a href="/" class="logo">GrowCode</a>

        <nav>
            <a href="/">Problems</a>
            <a href="/history.html">History</a>
            <a href="/leaderboard.html">Leaderboard</a>
            <a href="/admin.html" id="admin-link" hidden>Admin</a>
            <a href="/register.html" id="register-link">Register</a>
            <a href="/login.html" id="auth-link">Login</a>
        </nav>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Practice. Submit. Grow.</h1>
            <p>
                Solve programming problems and improve your problem-solving skills.
            </p>
        </section>

        <section>
            <div class="section-header">
                <h2>Problems</h2>
                <span id="problem-count">Loading...</span>
            </div>

            <div id="problems-container" class="problems-grid">
                <p>Loading problems...</p>
            </div>
        </section>
    </main>

    <script src="/js/app.js" defer></script>
    <script src="/js/auth.js" defer></script>
</body>
</html>
