<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | GrowCode</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body class="login-page">

    
    <header class="navbar">
        <a href="/" class="logo" aria-label="GrowCode home">GrowCode</a>

        <nav aria-label="Main navigation">
            <a href="/">Problems</a>
            <a href="/register.html">Register</a>
        </nav>
    </header>


    <main class="login-wrapper">

        <section class="login-brand">
            <h1>Grow<span>Code</span></h1>
            <p>Your workspace for solving problems and tracking progress.</p>
        </section>

        <section class="login-card">
            <h2>Welcome back</h2>
            <p class="login-description">
                Sign in to access your submissions and coding progress.
            </p>

            <form id="loginForm" class="login-form">

                <div class="login-field">
                    <label for="username">Username</label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        autocomplete="username"
                        required
                    >
                </div>

                <div class="login-field">
                    <label for="password">Password</label>

                    <div class="password-wrapper">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="password-toggle"
                            aria-label="Show password"
                            aria-pressed="false"
                        >Show</button>
                    </div>
                </div>

                <button type="submit" id="loginButton" class="login-button">
                    Login
                </button>

            </form>

            <p
                id="loginMessage"
                class="login-message"
                role="status"
                aria-live="polite"
            ></p>

            <p class="login-footer">
                Don't have an account?
                <a href="/register.html">Create an account</a>
            </p>
        </section>

        <p class="login-bottom-note">
            GrowCode · Multi-user code execution and management platform
        </p>

    </main>

    <script>
        const loginForm = document.getElementById("loginForm");
        const loginButton = document.getElementById("loginButton");
        const loginMessage = document.getElementById("loginMessage");
        const passwordInput = document.getElementById("password");
        const togglePassword = document.getElementById("togglePassword");

        togglePassword.addEventListener("click", () => {
            const shouldShow = passwordInput.type === "password";

            passwordInput.type = shouldShow ? "text" : "password";
            togglePassword.textContent = shouldShow ? "Hide" : "Show";
            togglePassword.setAttribute("aria-pressed", String(shouldShow));
            togglePassword.setAttribute(
                "aria-label",
                shouldShow ? "Hide password" : "Show password"
            );
        });

        loginForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            loginMessage.textContent = "";
            loginMessage.className = "login-message";
            loginButton.disabled = true;
            loginButton.textContent = "Signing in...";

            const username =
                document.getElementById("username").value.trim();

            const password = passwordInput.value;

            const formData = new URLSearchParams();
            formData.append("username", username);
            formData.append("password", password);

            try {
                const response = await fetch("/api/login", {
                    method: "POST",
                    headers: {
                        "Content-Type":
                            "application/x-www-form-urlencoded"
                    },
                    credentials: "include",
                    body: formData.toString()
                });

                const data = await response.json();

                if (response.ok) {
                    loginMessage.textContent =
                        "Login successful. Redirecting...";
                    loginMessage.classList.add("success");

                    if (data.role === "ADMIN") {
                        window.location.replace("/admin.html");
                    } else {
                        window.location.replace("/");
                    }

                    return;
                }

                loginMessage.textContent =
                    data.error || "Login failed. Check your credentials.";
                loginMessage.classList.add("error");

            } catch (error) {
                console.error("Login request failed:", error);

                loginMessage.textContent =
                    "Unable to connect to the server. Please try again.";
                loginMessage.classList.add("error");

            } finally {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        });
    </script>

</body>
</html>
